        <!-- Numeric keypad -->
        <div class="numeric-keypad">

  <button type="button">1</button>
  <button type="button">2</button>
  <button type="button">3</button>

  <button type="button">4</button>
  <button type="button">5</button>
  <button type="button">6</button>

  <button type="button">7</button>
  <button type="button">8</button>
  <button type="button">9</button>

  <button type="button">.</button>
  <button type="button">0</button>
  <button type="button" aria-label="Delete">⌫</button>

</div>

        <script>
const keypadButtons = document.querySelectorAll(".numeric-keypad button");
const amountInput = document.querySelector(".amount-number");

keypadButtons.forEach(button => {
  button.addEventListener("click", () => {
    const key = button.textContent.trim();

    if (key === "⌫") {
      amountInput.value =
        amountInput.value.length > 1
          ? amountInput.value.slice(0, -1)
          : "0";

    } else if (key === ".") {

      if (amountInput.value === "0") {
        amountInput.value = "0.";
      } else if (!amountInput.value.includes(".")) {
        amountInput.value += ".";
      }

    } else {

      if (amountInput.value === "0") {
        amountInput.value = key;
      } else {
        amountInput.value += key;
      }

    }

    amountInput.dispatchEvent(
      new Event("input", { bubbles: true })
      
    );
    const tokenBalanceName = document.querySelector(".token-balance-name");
const tokenBalanceUsd = document.querySelector(".token-balance-usd");

amountInput.addEventListener("input", () => {
    const value = amountInput.value || "0";

    tokenBalanceName.textContent = `${value} USDT`;

    const number = parseFloat(value);
    tokenBalanceUsd.textContent =
        !isNaN(number) && number > 0
            ? `$${number.toFixed(2)}`
            : "$0.00";
});
  });
});
</script>
